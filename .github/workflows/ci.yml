name: checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python behavior tests
        run: python -m unittest discover -s tests -v
      - name: Bash syntax
        run: bash -n scripts/preflight.sh scripts/gpu-container-test.sh scripts/miner-health.sh
      - name: GPU diagnostic smoke without physical GPU
        run: python scripts/gpu_detect.py --json --dry-run
      - name: Check interactive site syntax
        run: |
          node --check site/app.js
          node --check site/validator.js
          python -c "from html.parser import HTMLParser; from pathlib import Path; p=Path('site/validator.html'); assert p.is_file(); HTMLParser().feed(p.read_text(encoding='utf-8'))"
      - name: Check original SVG validity
        run: python -c "import glob,xml.etree.ElementTree as ET; [ET.parse(p) for p in glob.glob('assets/*.svg')]"
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell parser
        shell: pwsh
        run: |
          $files = @('scripts/diagnose.ps1', 'scripts/prepare.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Windows GPU diagnostic smoke
        run: python scripts/gpu_detect.py --json --dry-run
