<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Local GPU diagnostic architecture and official operator boundary</title><desc id="desc">Windows with WSL2 and native Ubuntu converge on a local GPU and container diagnostic layer. A dashed boundary separates environment tests from FLOP inference, registration, calibration and network-accepted work requiring independent evidence.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0e1b33"/><stop offset="1" stop-color="#1a3045"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="none" stroke="#77dfd0" stroke-width="2"/></marker></defs><rect width="1200" height="650" rx="25" fill="url(#bg)"/><text x="50" y="56" font-family="Arial,sans-serif" fill="#f5f8fd" font-size="25" font-weight="700">TWO HOST PATHS. ONE EVIDENCE BOUNDARY.</text><text x="50" y="84" font-family="Arial,sans-serif" fill="#aec5d9" font-size="15">İki işletim sistemi yolu. Ayrı kanıt sınırı.</text><g font-family="Arial,sans-serif"><rect x="54" y="121" width="525" height="149" rx="17" fill="#203750" stroke="#6e97ac"/><text x="76" y="155" fill="#75e1d0" font-size="16" font-weight="700">PATH A / WINDOWS 10–11</text><text x="76" y="187" fill="#f1f5f9" font-size="19">Windows driver → WSL2 Ubuntu 24.04</text><text x="76" y="222" fill="#b4c8da" font-size="14">Docker Desktop Linux engine + distro integration</text><rect x="621" y="121" width="525" height="149" rx="17" fill="#203750" stroke="#6e97ac"/><text x="643" y="155" fill="#75e1d0" font-size="16" font-weight="700">PATH B / NATIVE UBUNTU 24.04</text><text x="643" y="187" fill="#f1f5f9" font-size="19">Linux driver → Docker Engine</text><text x="643" y="222" fill="#b4c8da" font-size="14">NVIDIA Container Toolkit; no WSL2 layer</text><path d="M320 271v53h280v29m280-82v53H600v29" fill="none" stroke="#77dfd0" stroke-width="3" marker-end="url(#arrow)"/><rect x="256" y="354" width="688" height="118" rx="18" fill="#21434d" stroke="#70e3cf" stroke-width="2"/><text x="288" y="392" fill="#f5fbfb" font-size="22" font-weight="700">LOCAL GPU + CONTAINER DIAGNOSTICS</text><text x="288" y="423" fill="#c8e4e3" font-size="15">Per-device detection → pinned CUDA image smoke test → local report</text><text x="288" y="448" fill="#c8e4e3" font-size="14">Environment readiness only; no enrollment or work receipt</text><path d="M48 504h1104" stroke="#f0c481" stroke-width="2" stroke-dasharray="9 9"/><rect x="388" y="486" width="424" height="34" rx="8" fill="#29334a"/><text x="600" y="508" text-anchor="middle" fill="#f0c481" font-size="13" font-weight="700">OFFICIAL OPERATOR ASSETS + INDEPENDENT PROOF REQUIRED</text><rect x="56" y="542" width="525" height="70" rx="14" fill="#302f44" stroke="#9b8caa"/><text x="76" y="570" fill="#f5f6fb" font-size="17" font-weight="700">03  FLOP inference · registration · calibration</text><text x="76" y="594" fill="#e4bf8c" font-size="13">Not implemented here; requires authorized operator pack</text><rect x="619" y="542" width="525" height="70" rx="14" fill="#302f44" stroke="#9b8caa"/><text x="639" y="570" fill="#f5f6fb" font-size="17" font-weight="700">04  Network-accepted work</text><text x="639" y="594" fill="#e4bf8c" font-size="13">Requires actual network receipt; not implied by GPU tests</text></g></svg>