<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 395" role="img" aria-labelledby="title desc"><title id="title">Many GPU configurations, one per-device diagnostic</title><desc id="desc">Original four-card illustration showing a portable GPU, a desktop GPU, a professional GPU and a multi-GPU host. All are illustrative profiles, not measured machines or FLOP support claims.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10203a"/><stop offset="1" stop-color="#192f45"/></linearGradient><linearGradient id="chip" x2="1" y2="1"><stop stop-color="#75e7d1"/><stop offset="1" stop-color="#8f9ff4"/></linearGradient></defs><rect width="1140" height="395" rx="24" fill="url(#bg)"/><text x="40" y="52" fill="#f5f8fe" font-family="Arial,sans-serif" font-size="24" font-weight="700">GPU FIRST. MODEL CLAIMS LATER.</text><text x="40" y="78" fill="#b2c4d9" font-family="Arial,sans-serif" font-size="14">Illustrative configurations / Örnek yapılandırmalar — not measurements</text><g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(40 110)"><rect width="245" height="230" rx="18" fill="#20354f" stroke="#62869d"/><rect x="67" y="48" width="111" height="73" rx="7" stroke="url(#chip)" stroke-width="3" fill="none"/><rect x="48" y="132" width="150" height="6" rx="3" fill="#83e2d6"/><circle cx="122" cy="85" r="20" fill="none" stroke="#83e2d6" stroke-width="3"/><path d="M101 86h42m-21-21v42" stroke="#83e2d6" stroke-width="2"/><text x="122" y="175" fill="#f1f7fb" font-size="17" font-weight="700">PORTABLE</text><text x="122" y="199" fill="#b8ccdc" font-size="13">laptop thermal limits</text></g><g transform="translate(312 110)"><rect width="245" height="230" rx="18" fill="#20354f" stroke="#62869d"/><rect x="53" y="56" width="139" height="76" rx="8" stroke="url(#chip)" stroke-width="3" fill="none"/><circle cx="99" cy="94" r="23" fill="none" stroke="#83e2d6" stroke-width="3"/><circle cx="148" cy="94" r="23" fill="none" stroke="#83e2d6" stroke-width="3"/><circle cx="99" cy="94" r="5" fill="#83e2d6"/><circle cx="148" cy="94" r="5" fill="#83e2d6"/><text x="122" y="175" fill="#f1f7fb" font-size="17" font-weight="700">DESKTOP</text><text x="122" y="199" fill="#b8ccdc" font-size="13">per-device headroom</text></g><g transform="translate(584 110)"><rect width="245" height="230" rx="18" fill="#20354f" stroke="#62869d"/><rect x="63" y="50" width="119" height="85" rx="8" stroke="url(#chip)" stroke-width="3" fill="none"/><path d="M76 68h93M76 81h93M76 94h93M76 107h93" stroke="#83e2d6" stroke-width="3" stroke-linecap="round"/><text x="122" y="175" fill="#f1f7fb" font-size="17" font-weight="700">WORKSTATION</text><text x="122" y="199" fill="#b8ccdc" font-size="13">runtime still unverified</text></g><g transform="translate(856 110)"><rect width="245" height="230" rx="18" fill="#20354f" stroke="#62869d"/><rect x="65" y="53" width="50" height="73" rx="5" stroke="url(#chip)" stroke-width="3" fill="none"/><rect x="130" y="53" width="50" height="73" rx="5" stroke="url(#chip)" stroke-width="3" fill="none"/><circle cx="90" cy="88" r="15" stroke="#83e2d6" stroke-width="3" fill="none"/><circle cx="155" cy="88" r="15" stroke="#83e2d6" stroke-width="3" fill="none"/><text x="122" y="175" fill="#f1f7fb" font-size="17" font-weight="700">MULTI-GPU</text><text x="122" y="199" fill="#b8ccdc" font-size="13">no automatic pooling</text></g></g></svg>