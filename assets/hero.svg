<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
<title id="title">FLOP Local Miner — diagnostic mission control</title>
<desc id="desc">An original illustration of a luminous multi-GPU circuit on a midnight-blue dashboard. Four independent diagnostic gates remain unverified.</desc>
<defs>
