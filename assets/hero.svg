<text x="80" y="99" fill="#64e4ce" font-family="ui-monospace,monospace" font-size="15" letter-spacing="4">OPEN DIAGNOSTIC TOOLKIT / 01</text>
<text x="80" y="205" fill="#f5f8ff" font-family="Arial, sans-serif" font-size="59" font-weight="800" letter-spacing="-2">FLOP LOCAL</text>
<text x="80" y="274" fill="#f5f8ff" font-family="Arial, sans-serif" font-size="59" font-weight="800" letter-spacing="-2">MINER</text>
<text x="82" y="328" fill="#aabbd3" font-family="Arial,sans-serif" font-size="18">Understand your environment. Keep proof separate.</text>
<text x="82" y="359" fill="#aabbd3" font-family="Arial,sans-serif" font-size="18">Ortamını tanı. Kanıt seviyelerini ayrı tut.</text>
