  <linearGradient id="line" x2="1"><stop stop-color="#47dec8"/><stop offset="1" stop-color="#9c8ef4"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9bb0c9" stroke-opacity=".09"/></pattern>
  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
