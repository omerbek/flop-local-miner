<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 420" role="img" aria-labelledby="title desc"><title id="title">Windows to FLOP setup flow</title><desc id="desc">Five connected stages: Windows host, WSL2 Ubuntu, Docker GPU access, detected GPUs, and the locked official FLOP operator boundary. The flow is a guide, not evidence of completion.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b34"/><stop offset="1" stop-color="#182b43"/></linearGradient><linearGradient id="path" x2="1"><stop stop-color="#60dfcb"/><stop offset="1" stop-color="#b09ef7"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#7893ae" opacity=".18"/></pattern></defs><rect width="1240" height="420" rx="26" fill="url(#bg)"/><rect width="1240" height="420" rx="26" fill="url(#dots)"/><text x="50" y="66" fill="#f5f8fd" font-family="Arial,sans-serif" font-size="25" font-weight="700">THE ENVIRONMENT PATH</text><text x="50" y="95" fill="#b3c4d9" font-family="Arial,sans-serif" font-size="15">A sequence of checks, not a miner launch / Madenci başlatma değil, kontrol sırası</text><path d="M146 203h942" stroke="#5c7997" stroke-width="3" stroke-dasharray="8 9"/><path d="m1087 203-13-8m13 8-13 8" stroke="#b09ef7" stroke-width="3"/><g font-family="Arial,sans-serif" text-anchor="middle"><g><rect x="48" y="139" width="199" height="130" rx="20" fill="#20364f" stroke="#74d9cc"/><path d="M115 180h32v24h-32zm38 0h32v24h-32zm-38 30h32v24h-32zm38 0h32v24h-32z" fill="#69e3d0"/><text x="147" y="296" font-size="16" font-weight="700" fill="#f4f8fd">WINDOWS</text><text x="147" y="321" font-size="13" fill="#afc5d6">host + driver</text></g><g><rect x="284" y="139" width="199" height="130" rx="20" fill="#20364f" stroke="#74d9cc"/><path d="m345 217 26-39 27 39zm27-28 12 8-13 12-14-12z" fill="none" stroke="#69e3d0" stroke-width="3"/><circle cx="371" cy="181" r="5" fill="#69e3d0"/><text x="383" y="296" font-size="16" font-weight="700" fill="#f4f8fd">WSL2 UBUNTU</text><text x="383" y="321" font-size="13" fill="#afc5d6">Linux visibility</text></g><g><rect x="520" y="139" width="199" height="130" rx="20" fill="#20364f" stroke="#74d9cc"/><rect x="585" y="181" width="65" height="47" rx="6" fill="none" stroke="#69e3d0" stroke-width="3"/><path d="M592 197h51m-51 13h51m-45 12v8m38-8v8" stroke="#69e3d0" stroke-width="3"/><text x="619" y="296" font-size="16" font-weight="700" fill="#f4f8fd">DOCKER</text><text x="619" y="321" font-size="13" fill="#afc5d6">container test</text></g><g><rect x="756" y="139" width="199" height="130" rx="20" fill="#20364f" stroke="#74d9cc"/><rect x="817" y="174" width="78" height="58" rx="10" fill="none" stroke="#69e3d0" stroke-width="3"/><circle cx="856" cy="203" r="19" fill="none" stroke="#69e3d0" stroke-width="3"/><circle cx="856" cy="203" r="5" fill="#69e3d0"/><text x="855" y="296" font-size="16" font-weight="700" fill="#f4f8fd">GPU(S)</text><text x="855" y="321" font-size="13" fill="#afc5d6">per-device report</text></g><g><rect x="992" y="139" width="199" height="130" rx="20" fill="#312d42" stroke="#ecc68c" stroke-dasharray="7 5"/><rect x="1071" y="196" width="43" height="32" rx="5" fill="none" stroke="#f2c787" stroke-width="3"/><path d="M1079 196v-8a14 14 0 0 1 28 0v8" fill="none" stroke="#f2c787" stroke-width="3"/><text x="1091" y="296" font-size="16" font-weight="700" fill="#f4f8fd">FLOP</text><text x="1091" y="321" font-size="13" fill="#f2c787">operator assets required</text></g></g><rect x="50" y="360" width="1140" height="32" rx="9" fill="#263850"/><text x="69" y="381" fill="#c9d5e4" font-size="13" font-family="Arial,sans-serif">Native Ubuntu starts at Linux driver + Docker toolkit; it does not use the Windows or WSL2 stages.</text></svg>