<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 432" role="img" aria-labelledby="title desc"><title id="title">Four independent evidence levels, all initially unverified</title><desc id="desc">Visibility of a GPU, GPU access inside a container, authorized FLOP inference with registration and calibration, and actual accepted work are four different evidence stages. Every stage starts unknown, never automatically passed.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111d35"/><stop offset="1" stop-color="#192d43"/></linearGradient></defs><rect width="1220" height="432" rx="25" fill="url(#bg)"/><text x="48" y="54" fill="#f5f8fd" font-family="Arial,sans-serif" font-size="25" font-weight="700">FOUR GATES · FOUR KINDS OF PROOF</text><text x="48" y="80" fill="#b4c7d9" font-family="Arial,sans-serif" font-size="15">Dört eşik · dört bağımsız kanıt / Unknown by default</text><path d="M143 181h927" stroke="#7890a8" stroke-width="2" stroke-dasharray="5 10"/><g font-family="Arial,sans-serif"><g transform="translate(42 122)"><rect width="274" height="260" rx="18" fill="#20374e" stroke="#6e8ba2"/><circle cx="49" cy="51" r="24" fill="#2a5156" stroke="#82e2d6"/><text x="49" y="57" text-anchor="middle" font-size="18" fill="#e9fffa" font-weight="700">01</text><text x="26" y="110" fill="#f6f8fb" font-size="18" font-weight="700">GPU visibility</text><text x="26" y="143" fill="#bbccdb" font-size="13">Host / WSL2 / Ubuntu sees GPU</text><text x="26" y="167" fill="#bbccdb" font-size="13">Read-only device detection</text><rect x="26" y="201" width="112" height="34" rx="8" fill="#3e3d43"/><text x="39" y="223" fill="#f4cf9a" font-size="12" font-weight="700">UNKNOWN</text></g><g transform="translate(330 122)"><rect width="274" height="260" rx="18" fill="#20374e" stroke="#6e8ba2"/><circle cx="49" cy="51" r="24" fill="#2a5156" stroke="#82e2d6"/><text x="49" y="57" text-anchor="middle" font-size="18" fill="#e9fffa" font-weight="700">02</text><text x="26" y="110" fill="#f6f8fb" font-size="18" font-weight="700">Container access</text><text x="26" y="143" fill="#bbccdb" font-size="13">GPU inside pinned CUDA image</text><text x="26" y="167" fill="#bbccdb" font-size="13">Needs a separate smoke test</text><rect x="26" y="201" width="112" height="34" rx="8" fill="#3e3d43"/><text x="39" y="223" fill="#f4cf9a" font-size="12" font-weight="700">UNKNOWN</text></g><g transform="translate(618 122)"><rect width="274" height="260" rx="18" fill="#302f42" stroke="#9b8daa"/><circle cx="49" cy="51" r="24" fill="#514353" stroke="#ecc18e"/><text x="49" y="57" text-anchor="middle" font-size="18" fill="#fff7e9" font-weight="700">03</text><text x="26" y="110" fill="#f6f8fb" font-size="17" font-weight="700">FLOP qualification</text><text x="26" y="143" fill="#d2c8dc" font-size="13">Inference + registration</text><text x="26" y="167" fill="#d2c8dc" font-size="13">+ calibration accepted</text><rect x="26" y="201" width="112" height="34" rx="8" fill="#514353"/><text x="39" y="223" fill="#ffddb0" font-size="12" font-weight="700">UNKNOWN</text></g><g transform="translate(906 122)"><rect width="274" height="260" rx="18" fill="#302f42" stroke="#9b8daa"/><circle cx="49" cy="51" r="24" fill="#514353" stroke="#ecc18e"/><text x="49" y="57" text-anchor="middle" font-size="18" fill="#fff7e9" font-weight="700">04</text><text x="26" y="110" fill="#f6f8fb" font-size="17" font-weight="700">Accepted work</text><text x="26" y="143" fill="#d2c8dc" font-size="13">Real network-side receipt</text><text x="26" y="167" fill="#d2c8dc" font-size="13">No earnings promise</text><rect x="26" y="201" width="112" height="34" rx="8" fill="#514353"/><text x="39" y="223" fill="#ffddb0" font-size="12" font-weight="700">UNKNOWN</text></g></g></svg>